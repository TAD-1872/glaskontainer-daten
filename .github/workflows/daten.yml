name: Container-Daten erneuern

on:
  schedule:
    - cron: "17 3 * * 1"   # jeden Montag 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daten:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Container aus OpenStreetMap holen
        run: python tools/build_data.py .

      - name: Speichern
        run: |
          git config user.name "Glaskontainer-Daten"
          git config user.email "actions@users.noreply.github.com"
          git add cells hoefe deponien amtlich meta.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen"
          else
            git commit -m "Container-Daten $(date -u +%Y-%m-%d)"
            git push
          fi
